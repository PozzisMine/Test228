<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
}

input{
    width:250px;
    padding:10px;
    border:none;
    border-radius:8px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

#chart{
    width:100%;
    height:500px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>YouTube Analytics</h1>

<input
    id="videoId"
    placeholder="76GI6lNaIbM"
/>

<button onclick="loadVideo()">
Загрузить
</button>

<div id="info" class="card"></div>

<div id="chart"></div>

</div>

<script>

const chart = echarts.init(
    document.getElementById("chart")
);

async function loadVideo() {

    const id =
        document.getElementById("videoId")
        .value
        .trim();

    if(!id) return;

    const response =
        await fetch(
            `https://livecounts.lol/api/video/${id}/analytics`
        );

    const data =
        await response.json();

    document.getElementById("info")
        .innerHTML = `
        <h2>${data.video.title}</h2>

        <img
          src="${data.currentStats.thumbnailUrl}"
          width="320"
        >

        <p>
        Просмотры:
        ${data.currentStats.viewCount.toLocaleString()}
        </p>

        <p>
        Лайки:
        ${data.currentStats.likeCount.toLocaleString()}
        </p>

        <p>
        Рост:
        +${data.growth.viewGrowth.toLocaleString()}
        </p>
    `;

    const times =
        data.history.map(x =>
            new Date(x.timestamp)
            .toLocaleTimeString()
        );

    const views =
        data.history.map(x =>
            x.viewCount
        );

    const min =
        Math.min(...views);

    const max =
        Math.max(...views);

    chart.setOption({

        tooltip:{
            trigger:"axis"
        },

        dataZoom:[
            {
                type:"inside"
            },
            {
                type:"slider"
            }
        ],

        xAxis:{
            type:"category",
            data:times
        },

        yAxis:{
            type:"value",
            min:min - (max-min)*0.1,
            max:max + (max-min)*0.1
        },

        series:[
            {
                name:"Views",
                type:"line",
                smooth:true,
                showSymbol:false,
                data:views
            }
        ]
    });
}

</script>

</body>
</html>
