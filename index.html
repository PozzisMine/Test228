<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
}

input{
    width:250px;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:20px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
}

.card h3{
    margin:0 0 10px 0;
}

.card span{
    font-size:24px;
    font-weight:bold;
}

#thumbnail{
    margin-top:20px;
    border-radius:12px;
    max-width:100%;
}

.chart{
    width:100%;
    height:350px;
    margin-top:25px;
    background:#1e293b;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>YouTube Analytics</h1>

<input
id="videoId"
placeholder="Введите ID видео"
/>

<button onclick="loadVideo()">
Загрузить
</button>

<div id="title"></div>

<img id="thumbnail" />

<div class="stats">

<div class="card">
<h3>👁️ Просмотры</h3>
<span id="views">0</span>
</div>

<div class="card">
<h3>👍 Лайки</h3>
<span id="likes">0</span>
</div>

<div class="card">
<h3>💬 Комментарии</h3>
<span id="comments">0</span>
</div>

</div>

<div id="viewsChart" class="chart"></div>
<div id="likesChart" class="chart"></div>
<div id="commentsChart" class="chart"></div>

</div>

<script>

const viewsChart =
    echarts.init(
        document.getElementById("viewsChart")
    );

const likesChart =
    echarts.init(
        document.getElementById("likesChart")
    );

const commentsChart =
    echarts.init(
        document.getElementById("commentsChart")
    );

async function loadVideo(){

    const id =
        document.getElementById("videoId")
        .value
        .trim();

    if(!id){
        alert("Введите ID видео");
        return;
    }

    try{

        const response =
            await fetch(
                `https://livecounts.lol/api/video/${id}/analytics`
            );

        const data =
            await response.json();

        document.getElementById("title").innerHTML =
            `<h2>${data.video.title}</h2>`;

        document.getElementById("thumbnail").src =
            data.currentStats.thumbnailUrl;

        document.getElementById("views").textContent =
            data.currentStats.viewCount.toLocaleString();

        document.getElementById("likes").textContent =
            data.currentStats.likeCount.toLocaleString();

        document.getElementById("comments").textContent =
            data.currentStats.commentCount.toLocaleString();

        const times =
            data.history.map(x =>
                new Date(x.timestamp)
                .toLocaleTimeString()
            );

        const views =
            data.history.map(x =>
                x.viewCount
            );

        const likes =
            data.history.map(x =>
                x.likeCount
            );

        const comments =
            data.history.map(x =>
                x.commentCount
            );

        const zoom = [
            {type:"inside"},
            {type:"slider"}
        ];

        viewsChart.setOption({
            title:{text:"Просмотры"},
            tooltip:{trigger:"axis"},
            dataZoom:zoom,
            xAxis:{
                type:"category",
                data:times
            },
            yAxis:{
                type:"value",
                scale:true
            },
            series:[{
                type:"line",
                smooth:true,
                showSymbol:false,
                data:views
            }]
        });

        likesChart.setOption({
            title:{text:"Лайки"},
            tooltip:{trigger:"axis"},
            dataZoom:zoom,
            xAxis:{
                type:"category",
                data:times
            },
            yAxis:{
                type:"value",
                scale:true
            },
            series:[{
                type:"line",
                smooth:true,
                showSymbol:false,
                data:likes
            }]
        });

        commentsChart.setOption({
            title:{text:"Комментарии"},
            tooltip:{trigger:"axis"},
            dataZoom:zoom,
            xAxis:{
                type:"category",
                data:times
            },
            yAxis:{
                type:"value",
                scale:true
            },
            series:[{
                type:"line",
                smooth:true,
                showSymbol:false,
                data:comments
            }]
        });

    }catch(err){

        console.error(err);

        alert(
            "Ошибка загрузки данных"
        );

    }
}
</script>

</body>
</html>
